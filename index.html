<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>外网数据提交 V3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#f2f3f5;font-family:"微软雅黑";padding:20px;}
.card{max-width:380px;margin:0 auto;background:#fff;border-radius:12px;padding:25px;}
h3{text-align:center;margin-bottom:25px;color:#333;}
.item{margin-bottom:18px;}
label{display:block;margin-bottom:6px;font-size:14px;color:#666;}
input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:6px;font-size:16px;}
button{width:100%;padding:13px;background:#1677ff;color:#fff;border:none;border-radius:6px;font-size:16px;margin-top:10px;}
.msg{text-align:center;margin-top:16px;font-size:14px;}
</style>
</head>
<body>
<div class="card">
    <h3>数据提交 V3.0</h3>
    <div class="item">
        <label>姓名</label>
        <input type="text" id="name" placeholder="请输入姓名">
    </div>
    <div class="item">
        <label>性别</label>
        <input type="text" id="gender" placeholder="请输入性别">
    </div>
    <div class="item">
        <label>年龄</label>
        <input type="number" id="age" placeholder="请输入数字">
    </div>
    <button onclick="submitData()">立即提交</button>
    <div class="msg" id="msg"></div>
</div>

<script>
// ======================
// V3.0 最终稳定版
// ======================
const PA_URL = "https://a143b6b17a06ee96bf0f7eecad2dac.167d.powerautomate.com/api/flow/...";

async function submitData() {
    const msg = document.getElementById("msg");
    const name = document.getElementById("name").value.trim();
    const gender = document.getElementById("gender").value.trim();
    const ageInput = document.getElementById("age").value.trim();

    if (!name || !gender || !ageInput) {
        msg.innerText = "请填写完整";
        msg.style.color = "red";
        return;
    }

    const age = Number(ageInput);
    msg.innerText = "提交中...V3.0";

    try {
        await fetch(PA_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name,
                gender: gender,
                age: age
            })
        });
        msg.innerText = "✅ 提交成功 V3.0";
        msg.style.color = "green";
    } catch (e) {
        msg.innerText = "❌ 提交失败";
        msg.style.color = "red";
    }
}
</script>
</body>
</html>
